
{% extends "base.html" %}

{% block title %}Access Denied | WorkSphere{% endblock %}

{% block content %}

<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="card border-0 shadow-sm text-center">
                <div class="card-body p-5">

                    <div class="mb-4">
                        <i class="fa-solid fa-lock fa-4x text-warning"></i>
                    </div>

                    <h2 class="fw-bold mb-3">
                        Access Denied
                    </h2>

                    <p class="text-muted mb-4">
                        This module is not available for Client accounts.
                        You can return to your Client Dashboard to
                        view assigned projects and their progress.
                    </p>

                    <a
                        href="/dashboard/client/"
                        class="btn btn-primary px-4 py-2"
                    >
                        <i class="fa-solid fa-arrow-left me-2"></i>
                        Back to Client Dashboard
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
